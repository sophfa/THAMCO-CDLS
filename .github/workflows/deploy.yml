name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (for secrets scoping/approvals)"
        required: false
        default: "prod"
        type: choice
        options:
          - dev
          - prod
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "18"
  CI: "true"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event.inputs.environment || 'prod' }}
    env:
      PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC }}
      PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC }}
      PUBLISH_PROFILE_LOANS_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC }}
      PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Debug publish profiles (non-sensitive)
        run: |
          summarize() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "$name: MISSING"
            else
              echo "$name: present (length=${#value})"
            fi
          }
          summarize "catalogue profile" "${PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC}"
          summarize "inventory profile" "${PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC}"
          summarize "loans profile" "${PUBLISH_PROFILE_LOANS_SERVICE_FUNC}"
          summarize "notifications profile" "${PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC}"

      - name: Build catalogue-service-func
        working-directory: catalogue-service-func
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
          npm prune --production

      - name: Zip catalogue-service-func
        working-directory: catalogue-service-func
        run: zip -r ../catalogue-service-func.zip .

      - name: Deploy catalogue-service-func via Kudu Zip Deploy
        if: ${{ env.PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC != '' }}
        env:
          PUBLISH_PROFILE: ${{ env.PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC }}
        run: |
          set -euo pipefail
          PARSED=$(python - <<'PY'
import sys, xml.etree.ElementTree as ET
xml = sys.stdin.read()
root = ET.fromstring(xml)
zip_profile = None
for prof in root.findall('.//publishProfile'):
    if prof.get('publishMethod') == 'ZipDeploy':
        zip_profile = prof
        break
if zip_profile is None:
    zip_profile = root.find('.//publishProfile')
if zip_profile is None:
    sys.exit(1)
print(f"{zip_profile.get('userName','')} {zip_profile.get('userPWD','')} {zip_profile.get('publishUrl','')}")
PY
          )
          read -r USERNAME PASSWORD SCM_HOST <<<"$PARSED"
          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ] || [ -z "$SCM_HOST" ]; then
            echo "Failed to parse publish profile" >&2
            exit 1
          fi
          AUTH=$(printf "%s" "$USERNAME:$PASSWORD" | base64)
          curl --fail \
            -X POST \
            -H "Authorization: Basic ${AUTH}" \
            -H "Content-Type: application/zip" \
            --data-binary @catalogue-service-func.zip \
            "https://${SCM_HOST}/api/zipdeploy"

      - name: Build inventory-service-func
        working-directory: inventory-service-func
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
