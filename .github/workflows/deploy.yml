name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  CI: "true"

jobs:
  build-and-publish:
    name: Build and Package (catalogue-service-func)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: catalogue-service-func
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build (dist)
        run: npm run build

      - name: Prepare package folder
        run: |
          rm -rf package
          mkdir -p package/dist
          cp host.json package/
          cp package.json package/
          if [ -f package-lock.json ]; then cp package-lock.json package/; fi
          cp -r dist package/dist
          # install runtime deps only into package
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --prefix package
          else
            npm install --omit=dev --prefix package
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-service-func-package
          path: catalogue-service-func/package
          retention-days: 1

  deploy:
    name: Deploy to Function App
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC }}
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: catalogue-service-func-package
          path: package

      - name: Deploy catalogue-service-func
        if: ${{ env.PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC != '' }}
        uses: Azure/functions-action@v1
        with:
          app-name: catalogue-service-func
          publish-profile: ${{ env.PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC }}
          package: package
