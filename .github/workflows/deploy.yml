name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  CI: "true"

jobs:
  build-and-publish:
    name: Build and Package (catalogue-service-func)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: catalogue-service-func
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build (dist)
        run: npm run build

      - name: Prepare package folder
        run: |
          rm -rf package
          mkdir -p package/dist
          cp host.json package/
          cp package.json package/
          if [ -f package-lock.json ]; then cp package-lock.json package/; fi
          cp -r dist package/dist
          # install runtime deps only into package
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --prefix package
          else
            npm install --omit=dev --prefix package
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-service-func-package
          path: catalogue-service-func/package
          retention-days: 1

  deploy:
    name: Deploy to Function App
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC }}
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: catalogue-service-func-package
          path: package

      - name: Zip package
        run: |
          cd package
          zip -r ../package.zip .

      - name: Deploy via Kudu Zip Deploy
        if: ${{ env.PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC != '' }}
        env:
          PUBLISH_PROFILE: ${{ env.PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC }}
        run: |
          set -euo pipefail

          # Extract ZipDeploy credentials and SCM host from publish profile XML
          read -r USERNAME PASSWORD SCM_HOST <<'EOF'
$(python - <<'PY'
import sys, xml.etree.ElementTree as ET
xml = sys.stdin.read()
root = ET.fromstring(xml)
zip_profile = None
for prof in root.findall('.//publishProfile'):
    if prof.get('publishMethod') == 'ZipDeploy':
        zip_profile = prof
        break
if zip_profile is None:
    # fallback to any profile
    zip_profile = root.find('.//publishProfile')
if zip_profile is None:
    sys.exit(1)
print(f"{zip_profile.get('userName','')} {zip_profile.get('userPWD','')} {zip_profile.get('publishUrl','')}")
PY
EOF


          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ] || [ -z "$SCM_HOST" ]; then
            echo "Failed to parse publish profile" >&2
            exit 1
          fi

          DEPLOY_URL="https://${SCM_HOST}/api/zipdeploy"
          # Build Basic auth header to avoid shell escaping issues with backslashes
          AUTH_HEADER=$(printf "%s" "$USERNAME:$PASSWORD" | base64)

          # Upload zipped package to Kudu Zip Deploy endpoint
          curl --fail \
            -X POST \
            -H "Authorization: Basic ${AUTH_HEADER}" \
            -H "Content-Type: application/zip" \
            --data-binary @package.zip \
            "$DEPLOY_URL"
