name: Build and Deploy to Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build-and-publish:
    name: Build and Package (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: catalogue
            path: catalogue-service-func
            artifact: package-catalogue
          - name: inventory
            path: inventory-service-func
            artifact: package-inventory
          - name: loans
            path: loans-service-func
            artifact: package-loans
          - name: notifications
            path: notifications-service-func
            artifact: package-notifications
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build (into ./dist)
        working-directory: ${{ matrix.path }}
        run: npm run build

      - name: Publish function app to package folder
        working-directory: ${{ matrix.path }}
        run: |
          rm -rf package
          mkdir -p package/dist
          cp host.json package/
          cp package.json package/
          if [ -f package-lock.json ]; then cp package-lock.json package/; fi
          cp -r dist package/dist
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --prefix package
          else
            npm install --omit=dev --prefix package
          fi

      - name: Save package temporarily for deployment
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}/package
          retention-days: 1

  deploy-to-test:
    name: Deploy (${{ matrix.name }})
    needs: build-and-publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: catalogue
            app-name: catalogue-service-func
            artifact: package-catalogue
            secret: AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC
          - name: inventory
            app-name: inventory-service-func
            artifact: package-inventory
            secret: AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC
          - name: loans
            app-name: loans-service-func
            artifact: package-loans
            secret: AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC
          - name: notifications
            app-name: notifications-service-func
            artifact: package-notifications
            secret: AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC
    steps:
      - name: Download package artefact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package

      - name: Deploy to Azure Function App
        if: ${{ secrets[matrix.secret] != '' }}
        uses: azure/functions-action@v1
        with:
          app-name: ${{ matrix.app-name }}
          package: package
          publish-profile: ${{ secrets[matrix.secret] }}
