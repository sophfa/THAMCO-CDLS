name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (for secrets scoping/approvals)"
        required: false
        default: "prod"
        type: choice
        options:
          - dev
          - prod
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "18"
  CI: "true"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event.inputs.environment || 'prod' }}
    env:
      AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC }}
      AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC }}
      AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC }}
      AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Debug publish profiles (non-sensitive)
        run: |
          summarize() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "$name: MISSING"
            else
              echo "$name: present (length=${#value})"
            fi
          }
          summarize "catalogue profile" "${AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC}"
          summarize "inventory profile" "${AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC}"
          summarize "loans profile" "${AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC}"
          summarize "notifications profile" "${AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC}"
        env:
          AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC }}
          AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC }}
          AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC }}
          AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC }}

      - name: Build catalogue-service-func
        working-directory: catalogue-service-func
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
          npm prune --production

      - name: Deploy catalogue-service-func
        if: ${{ env.AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC != '' }}
        uses: Azure/functions-action@v1
        with:
          app-name: catalogue-service-func
          publish-profile: ${{ env.AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC }}
          package: catalogue-service-func

      - name: Build inventory-service-func
        working-directory: inventory-service-func
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
          npm prune --production

      - name: Deploy inventory-service-func
        if: ${{ env.AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC != '' }}
        uses: Azure/functions-action@v1
        with:
          app-name: inventory-service-func
          publish-profile: ${{ env.AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC }}
          package: inventory-service-func

      - name: Build loans-service-func
        working-directory: loans-service-func
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
          npm prune --production

      - name: Deploy loans-service-func
        if: ${{ env.AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC != '' }}
        uses: Azure/functions-action@v1
        with:
          app-name: loans-service-func
          publish-profile: ${{ env.AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC }}
          package: loans-service-func

      - name: Build notifications-service-func
        working-directory: notifications-service-func
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
          npm prune --production

      - name: Deploy notifications-service-func
        if: ${{ env.AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC != '' }}
        uses: Azure/functions-action@v1
        with:
          app-name: notifications-service-func
          publish-profile: ${{ env.AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC }}
          package: notifications-service-func

      - name: Summary
        run: |
          echo "Deployment complete (or skipped if secrets missing)."
