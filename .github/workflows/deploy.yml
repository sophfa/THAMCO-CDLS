name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: false
        default: "prod"
        type: choice
        options: [dev, prod]

  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "18"
  CI: "true"

jobs:
  deploy:
    name: Build & Deploy All Services
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event.inputs.environment || 'prod' }}

    env:
      PROFILE_CATALOGUE: ${{ secrets.AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC }}
      PROFILE_INVENTORY: ${{ secrets.AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC }}
      PROFILE_LOANS: ${{ secrets.AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC }}
      PROFILE_NOTIFICATIONS: ${{ secrets.AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Debug publish profiles
        run: |
          check() { test -z "$2" && echo "$1: MISSING" || echo "$1: present"; }
          check "catalogue"     "$PROFILE_CATALOGUE"
          check "inventory"     "$PROFILE_INVENTORY"
          check "loans"         "$PROFILE_LOANS"
          check "notifications" "$PROFILE_NOTIFICATIONS"

      - name: Deploy all services
        run: |
          deploy_service() {
            SERVICE="$1"
            DIR="$2"
            PROFILE="$3"

            echo "---------------------------------------"
            echo "Deploying $SERVICE"
            echo "---------------------------------------"

            if [ -z "$PROFILE" ]; then
              echo "No publish profile → skipping $SERVICE"
              return
            fi

            # Build
            cd "$DIR"
            npm ci || npm install
            npm run build
            npm prune --production
            cd ..

            # Zip
            ZIPFILE="${SERVICE}.zip"
            rm -f "$ZIPFILE"
            zip -r "$ZIPFILE" "$DIR" > /dev/null

            # Extract credentials from XML using sed (NO PYTHON, NO YAML BREAKAGE)
            USERNAME=$(echo "$PROFILE" | sed -n 's/.*userName="\([^"]*\)".*/\1/p')
            PASSWORD=$(echo "$PROFILE" | sed -n 's/.*userPWD="\([^"]*\)".*/\1/p')
            SCM_HOST=$(echo "$PROFILE" | sed -n 's/.*publishUrl="\([^"]*\)".*/\1/p')

            if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ] || [ -z "$SCM_HOST" ]; then
              echo "ERROR: Failed to parse publish profile for $SERVICE"
              exit 1
            fi

            AUTH=$(printf "%s" "$USERNAME:$PASSWORD" | base64)

            echo "Deploying ZIP to Kudu..."
            curl --fail \
              -X POST \
              -H "Authorization: Basic ${AUTH}" \
              -H "Content-Type: application/zip" \
              --data-binary @"$ZIPFILE" \
              "https://${SCM_HOST}/api/zipdeploy"

            echo "$SERVICE deployed successfully."
          }

          deploy_service "catalogue-service-func"     "catalogue-service-func"     "$PROFILE_CATALOGUE"
          deploy_service "inventory-service-func"     "inventory-service-func"     "$PROFILE_INVENTORY"
          deploy_service "loans-service-func"         "loans-service-func"         "$PROFILE_LOANS"
          deploy_service "notifications-service-func" "notifications-service-func" "$PROFILE_NOTIFICATIONS"

      - name: Done
        run: echo "Deployment complete."
