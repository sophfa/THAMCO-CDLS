name: Deploy to test, integration tests, and deploy to prod (prod gated)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    uses: ./.github/workflows/reusable-functions-build.yml
    with:
      node-version: "22"
      matrix: |
        {"include":[
          {"name":"catalogue","path":"catalogue-service-func","artifact":"package-catalogue"},
          {"name":"inventory","path":"inventory-service-func","artifact":"package-inventory"},
          {"name":"loans","path":"loans-service-func","artifact":"package-loans"},
          {"name":"notifications","path":"notifications-service-func","artifact":"package-notifications"}
        ]}

  deploy-to-test:
    needs: build-and-publish
    uses: ./.github/workflows/reusable-functions-deploy.yml
    with:
      environment: test
      matrix: |
        {"include":[
          {"name":"catalogue","app-name":"catalogue-service-func","artifact":"package-catalogue","secret":"AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC"},
          {"name":"inventory","app-name":"inventory-service-func","artifact":"package-inventory","secret":"AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC"},
          {"name":"loans","app-name":"loans-service-func","artifact":"package-loans","secret":"AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC"},
          {"name":"notifications","app-name":"notifications-service-func","artifact":"package-notifications","secret":"AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC"}
        ]}
    secrets: inherit

  deploy-frontend-test:
    needs: deploy-to-test
    uses: ./.github/workflows/reusable-frontend-deploy.yml
    with:
      environment: test
      deploy-env: test
      node-version: "22"
    secrets: inherit

  integration-flow-test:
    name: Loan -> Inventory Integration (Test)
    runs-on: ubuntu-latest
    needs: deploy-to-test
    env:
      LOANS_API_URL: ${{ secrets.VITE_LOANS_API_URL_TEST }}
      INVENTORY_API_URL: ${{ secrets.VITE_INVENTORY_API_URL_TEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run smoke tests
        run: node scripts/integration/smoke-test.mjs

  deploy-to-prod:
    needs: [build-and-publish, deploy-to-test]
    uses: ./.github/workflows/reusable-functions-deploy.yml
    with:
      environment: prod
      matrix: |
        {"include":[
          {"name":"catalogue","app-name":"catalogue-service-func-prod","artifact":"package-catalogue","secret":"AZURE_PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC_PROD"},
          {"name":"inventory","app-name":"inventory-service-func-prod","artifact":"package-inventory","secret":"AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC_PROD"},
          {"name":"loans","app-name":"loans-service-func-prod","artifact":"package-loans","secret":"AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC_PROD"},
          {"name":"notifications","app-name":"notifications-service-func-prod","artifact":"package-notifications","secret":"AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC_PROD"}
        ]}
    secrets: inherit

  deploy-frontend:
    needs: deploy-to-prod
    uses: ./.github/workflows/reusable-frontend-deploy.yml
    with:
      environment: prod
      deploy-env: prod
      node-version: "22"
    secrets: inherit
