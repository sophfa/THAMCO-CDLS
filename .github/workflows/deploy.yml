name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (for secrets scoping/approvals)"
        required: false
        default: "prod"
        type: choice
        options:
          - dev
          - prod
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "18"
  CI: "true"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event.inputs.environment || 'prod' }}
    env:
      PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC: <publishData><publishProfile profileName="catalogue-service-func - Web Deploy" publishMethod="MSDeploy" publishUrl="catalogue-service-func.scm.azurewebsites.net:443" msdeploySite="catalogue-service-func" userName="REDACTED" userPWD="REDACTED" destinationAppUrl="http://catalogue-service-func.azurewebsites.net" SQLServerDBConnectionString="REDACTED" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile><publishProfile profileName="catalogue-service-func - FTP" publishMethod="FTP" publishUrl="ftps://waws-prod-par-025.ftp.azurewebsites.windows.net/site/wwwroot" ftpPassiveMode="True" userName="REDACTED" userPWD="REDACTED" destinationAppUrl="http://catalogue-service-func.azurewebsites.net" SQLServerDBConnectionString="REDACTED" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile><publishProfile profileName="catalogue-service-func - Zip Deploy" publishMethod="ZipDeploy" publishUrl="catalogue-service-func.scm.azurewebsites.net:443" userName="REDACTED" userPWD="REDACTED" destinationAppUrl="http://catalogue-service-func.azurewebsites.net" SQLServerDBConnectionString="REDACTED" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile></publishData>
      PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC }}
      PUBLISH_PROFILE_LOANS_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_LOANS_SERVICE_FUNC }}
      PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC: ${{ secrets.AZURE_PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Debug publish profile parse (non-sensitive)
        run: |
          set -euo pipefail
          PARSED=$(python - <<'PY'
import sys, xml.etree.ElementTree as ET
xml = sys.stdin.read()
root = ET.fromstring(xml)
zip_profile = None
for prof in root.findall('.//publishProfile'):
    if prof.get('publishMethod') == 'ZipDeploy':
        zip_profile = prof
        break
if zip_profile is None:
    zip_profile = root.find('.//publishProfile')
if zip_profile is None:
    sys.exit(1)
user = bool(zip_profile.get('userName',''))
pwd = bool(zip_profile.get('userPWD',''))
host = zip_profile.get('publishUrl','')
print(f"user_present={user} pwd_present={pwd} host={host}")
PY
          )
          echo "$PARSED"

      - name: Build catalogue-service-func
        working-directory: catalogue-service-func
        run: |
          npm ci
          npm run build
          npm prune --production

      - name: Deploy catalogue-service-func
        if: ${{ env.PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC != '' }}
        uses: Azure/functions-action@v1
        with:
          app-name: catalogue-service-func
          publish-profile: ${{ env.PUBLISH_PROFILE_CATALOGUE_SERVICE_FUNC }}
          package: catalogue-service-func

      - name: Build inventory-service-func
        working-directory: inventory-service-func
        run: |
          npm ci
          npm run build
          npm prune --production

      - name: Deploy inventory-service-func
        if: ${{ env.PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC != '' }}
        uses: Azure/functions-action@v1
        with:
          app-name: inventory-service-func
          publish-profile: ${{ env.PUBLISH_PROFILE_INVENTORY_SERVICE_FUNC }}
          package: inventory-service-func

      - name: Build loans-service-func
        working-directory: loans-service-func
        run: |
          npm ci
          npm run build
          npm prune --production

      - name: Deploy loans-service-func
        if: ${{ env.PUBLISH_PROFILE_LOANS_SERVICE_FUNC != '' }}
        uses: Azure/functions-action@v1
        with:
          app-name: loans-service-func
          publish-profile: ${{ env.PUBLISH_PROFILE_LOANS_SERVICE_FUNC }}
          package: loans-service-func

      - name: Build notifications-service-func
        working-directory: notifications-service-func
        run: |
          npm ci
          npm run build
          npm prune --production

      - name: Deploy notifications-service-func
        if: ${{ env.PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC != '' }}
        uses: Azure/functions-action@v1
        with:
          app-name: notifications-service-func
          publish-profile: ${{ env.PUBLISH_PROFILE_NOTIFICATIONS_SERVICE_FUNC }}
          package: notifications-service-func

      - name: Summary
        run: |
          echo "Deployment complete (or skipped if secrets missing)."
