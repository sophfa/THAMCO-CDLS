name: Reusable - Build Functions

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      matrix:
        type: string
        required: true
      artifact-retention-days:
        type: number
        default: 1

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and Package (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build (into ./dist)
        working-directory: ${{ matrix.path }}
        run: npm run build

      - name: Package with Azure Functions Core Tools
        working-directory: ${{ matrix.path }}
        env:
          FUNCTIONS_WORKER_RUNTIME: node
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true
          # Produce a single zip ready for run-from-package
          npx func pack --build --worker-runtime node --output ../${{ matrix.artifact }}.zip

      - name: Save package temporarily for deployment
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: ${{ inputs.artifact-retention-days }}
